# OmiSphere — Hugging Face MODEL registration manifest (OMI_ANALYST_MODEL_IMPORT_V1)
#
# Declares the target HF MODEL repo and the exact file map that the registration
# pipeline (ml/analyst/register_hf_model.py) publishes to it. This populates the
# permanent Analyst registry `Andrewexiga/omi-analyst-v1` with the V1 model card,
# config, base pointer, prompt, and response schema.
#
# Source of truth is GitHub: prompt/schema are published FROM their canonical
# ml/analyst/ locations (single copy, no drift); the HF-side card/config/base/
# attributes live under ml/analyst/hf_repo/. source paths are repo-root relative.
#
# SAFE BY DEFAULT: the pipeline validates and does nothing without --upload.
# It does NOT fine-tune, train, modify production scoring/detectors/OmiScore, or
# touch apps/api | apps/web. V1 publishes NO weights (base model + prompt only).

schema_version = 1

[target]
repo_id = "Andrewexiga/omi-analyst-v1"
repo_type = "model"
private = true
base_model = "Qwen/Qwen3-4B-Thinking-2507-FP8"
pretty_name = "Omi Analyst (registry)"

# --- the HF model card (root README; carries the base_model YAML metadata) ---
[[file]]
source = "ml/analyst/hf_repo/README.md"
path_in_repo = "README.md"
kind = "model_card"

# --- configuration ---
[[file]]
source = "ml/analyst/hf_repo/config/analyst_config.json"
path_in_repo = "config/analyst_config.json"
kind = "config"

[[file]]
source = "ml/analyst/hf_repo/config/generation_config.json"
path_in_repo = "config/generation_config.json"
kind = "config"

# --- base-model pointer (V1 ships no weights) ---
[[file]]
source = "ml/analyst/hf_repo/base/BASE_MODEL.md"
path_in_repo = "base/BASE_MODEL.md"
kind = "base_pointer"

# --- LFS rules (correct for future adapters/weights) ---
[[file]]
source = "ml/analyst/hf_repo/.gitattributes"
path_in_repo = ".gitattributes"
kind = "attributes"

# --- system prompt: published FROM its canonical GitHub source (no copy) ---
[[file]]
source = "ml/analyst/analyst_system_prompt_v1.md"
path_in_repo = "prompts/analyst_system_prompt_v1.md"
kind = "prompt"

# --- prompt manifest: generated FROM the app Prompt Registry (single source of truth) by
# apps/api app.reasoning.prompts.export; carries every prompt's version + content hash, the
# constitution version + hash, and the specialist-library status. A drift-guard test keeps it
# in lockstep with the registry, so GitHub and HF cannot diverge on prompt integrity. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/prompt_manifest.json"
path_in_repo = "prompts/prompt_manifest.json"
kind = "prompt_manifest"

# --- prompt catalog: complete per-prompt metadata (mission, inputs/outputs, constraints,
# evidence/citation/memory/context rules, Governor compatibility, schema, version, hash,
# constitution version, dependencies) for the production prompt + the 13 specialists.
# Generated FROM the registry + specialist library; drift-guarded. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/prompt_catalog.json"
path_in_repo = "prompts/prompt_catalog.json"
kind = "prompt_catalog"

# --- Intelligence Library index: the curated knowledge (25 entries across 14 categories) the
# specialists reason from — per-entry metadata + content hash, category taxonomy, and the
# specialist dependency map. Generated FROM app.reasoning.knowledge (single source of truth);
# full entry bodies stay canonical in GitHub (not duplicated). Drift-guarded. ---
[[file]]
source = "ml/analyst/hf_repo/knowledge/knowledge_manifest.json"
path_in_repo = "knowledge/knowledge_manifest.json"
kind = "knowledge_manifest"

# --- response schema: published FROM its canonical GitHub source (no copy) ---
[[file]]
source = "ml/analyst/analyst_response_schema.json"
path_in_repo = "schema/analyst_response_schema.json"
kind = "schema"
