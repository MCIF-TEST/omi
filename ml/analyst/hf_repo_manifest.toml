# OmiSphere — Hugging Face MODEL registration manifest (OMI_ANALYST_MODEL_IMPORT_V1)
#
# Declares the target HF MODEL repo and the exact file map that the registration
# pipeline (ml/analyst/register_hf_model.py) publishes to it. This populates the
# permanent Analyst registry `Andrewexiga/omi-analyst-v1` with the V1 model card,
# config, base pointer, prompt, and response schema.
#
# Source of truth is GitHub: prompt/schema are published FROM their canonical
# ml/analyst/ locations (single copy, no drift); the HF-side card/config/base/
# attributes live under ml/analyst/hf_repo/. source paths are repo-root relative.
#
# SAFE BY DEFAULT: the pipeline validates and does nothing without --upload.
# It does NOT fine-tune, train, modify production scoring/detectors/OmiScore, or
# touch apps/api | apps/web. V1 publishes NO weights (base model + prompt only).

schema_version = 1

[target]
repo_id = "Andrewexiga/omi-analyst-v1"
repo_type = "model"
private = true
base_model = "mistralai/Mistral-7B-Instruct-v0.3"
pretty_name = "Omi Analyst (registry)"

# --- the HF model card (root README; carries the base_model YAML metadata) ---
[[file]]
source = "ml/analyst/hf_repo/README.md"
path_in_repo = "README.md"
kind = "model_card"

# --- configuration ---
[[file]]
source = "ml/analyst/hf_repo/config/analyst_config.json"
path_in_repo = "config/analyst_config.json"
kind = "config"

[[file]]
source = "ml/analyst/hf_repo/config/generation_config.json"
path_in_repo = "config/generation_config.json"
kind = "config"

# --- base-model pointer (V1 ships no weights) ---
[[file]]
source = "ml/analyst/hf_repo/base/BASE_MODEL.md"
path_in_repo = "base/BASE_MODEL.md"
kind = "base_pointer"

# --- LFS rules (correct for future adapters/weights) ---
[[file]]
source = "ml/analyst/hf_repo/.gitattributes"
path_in_repo = ".gitattributes"
kind = "attributes"

# --- system prompt: published FROM its canonical GitHub source (no copy) ---
[[file]]
source = "ml/analyst/analyst_system_prompt_v1.md"
path_in_repo = "prompts/analyst_system_prompt_v1.md"
kind = "prompt"

# --- prompt manifest: generated FROM the app Prompt Registry (single source of truth) by
# apps/api app.reasoning.prompts.export; carries every prompt's version + content hash, the
# constitution version + hash, and the specialist-library status. A drift-guard test keeps it
# in lockstep with the registry, so GitHub and HF cannot diverge on prompt integrity. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/prompt_manifest.json"
path_in_repo = "prompts/prompt_manifest.json"
kind = "prompt_manifest"

# --- prompt catalog: complete per-prompt metadata (mission, inputs/outputs, constraints,
# evidence/citation/memory/context rules, Governor compatibility, schema, version, hash,
# constitution version, dependencies) for the production prompt + the 13 specialists.
# Generated FROM the registry + specialist library; drift-guarded. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/prompt_catalog.json"
path_in_repo = "prompts/prompt_catalog.json"
kind = "prompt_catalog"

# --- Intelligence Library index: the curated knowledge (25 entries across 14 categories) the
# specialists reason from — per-entry metadata + content hash, category taxonomy, and the
# specialist dependency map. Generated FROM app.reasoning.knowledge (single source of truth);
# full entry bodies stay canonical in GitHub (not duplicated). Drift-guarded. ---
[[file]]
source = "ml/analyst/hf_repo/knowledge/knowledge_manifest.json"
path_in_repo = "knowledge/knowledge_manifest.json"
kind = "knowledge_manifest"

# --- prompt template + response contract: the canonical assembly asset (P1.1) the Prompt Builder
# fills. Generated FROM app.reasoning.prompts.template (single source of truth) by
# app.reasoning.prompts.export; drift-guarded so GitHub and HF cannot diverge on the scaffolding. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/prompt_template.json"
path_in_repo = "prompts/prompt_template.json"
kind = "prompt_template"

# --- comment-analysis prompt template + response contract + output schema (P3.1): the canonical
# assembly asset the Comment Prompt Builder fills for the first AI-native reasoning stage. Generated
# FROM app.reasoning.prompts.comment_template (single source of truth) by
# app.reasoning.prompts.export; drift-guarded. Additive — independent of prompt_template.json. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/comment_prompt_template.json"
path_in_repo = "prompts/comment_prompt_template.json"
kind = "comment_prompt_template"

# --- commenter-history prompt template + response contract + output schema (P3.2): the canonical
# assembly asset the Commenter History Prompt Builder fills. Generated FROM
# app.reasoning.prompts.commenter_history_template (single source of truth) by
# app.reasoning.prompts.export; drift-guarded. Additive — independent of the other templates. ---
[[file]]
source = "ml/analyst/hf_repo/prompts/commenter_history_prompt_template.json"
path_in_repo = "prompts/commenter_history_prompt_template.json"
kind = "commenter_history_prompt_template"

# --- investigation-summary prompt template + response contract + output-schema descriptor (P3.4): the
# canonical assembly asset the Investigation Summary Prompt Builder fills for the overall investigation
# assessment. Generated FROM app.reasoning.prompts.investigation_summary_template (single source of
# truth) by app.reasoning.prompts.export; drift-guarded. Additive — independent of the other templates
# and the investigation package_hash; reuses the existing analyst_response_schema (no new schema). ---
[[file]]
source = "ml/analyst/hf_repo/prompts/investigation_summary_prompt_template.json"
path_in_repo = "prompts/investigation_summary_prompt_template.json"
kind = "investigation_summary_prompt_template"

# --- comprehensive-investigation prompt template + response contract + output-schema descriptor
# (single-inference architecture): the canonical assembly asset the comprehensive Prompt Builder fills
# so ONE Mistral inference reasons over the complete budgeted InvestigationPackage. Generated FROM
# app.reasoning.prompts.comprehensive_investigation_template (single source of truth) by
# app.reasoning.prompts.export; drift-guarded. Additive — independent of the other templates and the
# investigation package_hash; the Lead-Investigator synthesis wrapper reuses the existing
# analyst_response_schema (no new schema). ---
[[file]]
source = "ml/analyst/hf_repo/prompts/comprehensive_investigation_prompt_template.json"
path_in_repo = "prompts/comprehensive_investigation_prompt_template.json"
kind = "comprehensive_investigation_prompt_template"

# --- response schema: published FROM its canonical GitHub source (no copy) ---
[[file]]
source = "ml/analyst/analyst_response_schema.json"
path_in_repo = "schema/analyst_response_schema.json"
kind = "schema"
