# OMISPHERE — Render Blueprint
#
# Provisions both services + database in one click:
#   - omisphere-web      (Next.js 14)
#   - omisphere-api      (FastAPI / omi engine)
#   - omisphere-postgres (Postgres database)
#
# After connecting this repo to Render and clicking "New Blueprint":
#   1. Render creates all three resources.
#   2. DATABASE_URL is auto-wired from omisphere-postgres into the api.
#   3. Fill in the remaining `sync: false` env vars in the dashboard.
#   4. Add your custom domain to omisphere-web; point omisphere-api at it
#      under a subdomain (e.g. api.yourdomain.com).
#
# ---------------------------------------------------------------------------
# STRIPE — webhook crediting, with API reconciliation as the backstop
# ---------------------------------------------------------------------------
# Checkout is Stripe-hosted. Credits arrive by TWO routes on purpose:
#   1. WEBHOOK (primary)  — Stripe pushes invoice.paid; credits land in seconds.
#   2. API reconciliation — asks Stripe what was actually paid, on return from
#      checkout, on the billing page, and before a scan would be refused.
# Both claim the same per-invoice row, so only one can ever grant. Keep both: a
# webhook can be misregistered or its secret rotated out of sync, and the
# backstop is what stops that becoming a customer who paid and got nothing.
#
# Required on omisphere-api (dashboard secrets):
#   OMI_STRIPE_SECRET_KEY     sk_test_… or sk_live_…   (SECRET — not the pk_ key)
#   OMI_STRIPE_PRICE_ID       price_… recurring monthly, same mode as the secret
#   OMI_PUBLIC_BASE_URL       https://<your-web-host>  (WEB URL, not the API host)
#   OMI_STRIPE_WEBHOOK_SECRET whsec_…  (from the endpoint you register, below)
#
# Registering the webhook:
#   Stripe Dashboard → Developers → Webhooks → Add endpoint
#   URL:    https://<your-API-host>/v1/billing/webhook
#           ^ the API host, NOT OMI_PUBLIC_BASE_URL (that is the web app).
#   Events: invoice.paid, invoice.payment_failed,
#           customer.subscription.created, customer.subscription.updated,
#           customer.subscription.deleted, checkout.session.completed
#   Then copy the endpoint's SIGNING SECRET (whsec_…) into
#   OMI_STRIPE_WEBHOOK_SECRET and redeploy the API.
#
# GET /v1/billing/preflight prints the exact URL and event list for THIS
# deployment, and reports whether Stripe has ever actually reached it. Call it
# directly on the API host — through the web app's /api proxy it cannot tell
# which host to give you, and says so rather than printing a wrong one.
#
# Optional on omisphere-api:
#   OMI_SUBSCRIPTION_PRICE_DISPLAY   $13.99  (UI label only)
#   OMI_MONTHLY_CREDIT_GRANT         20
#
# NOT used by current billing:
#   STRIPE_PUBLISHABLE_KEY / pk_… keys — Checkout never loads Stripe.js in the
#   browser, so a publishable key does nothing for Subscribe. If you set one for
#   future client-side Stripe features, put NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   on the WEB service only. Never put sk_ secrets on the web service.
#
# Dashboard: Settings → Billing → Customer portal → enable (for Manage subscription).
# Verify after deploy (signed in, browser console on the web app):
#   await (await fetch('/api/v1/billing/preflight')).json()
# Expect ready: true.
# ---------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------
  # API — FastAPI
  # ---------------------------------------------------------------
  - type: web
    name: omisphere-api
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: apps/api
    # Installs core deps (incl. httpx — required by the Twitter/X client) plus
    # the youtube + postgres extras. httpx is intentionally a CORE dependency,
    # not an extra, so this command can never ship without it.
    buildCommand: pip install -e .[youtube,postgres]
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OMI_ENV
        value: production
      - key: OMI_REQUIRE_AUTH
        value: 'true'
      - key: OMI_LOG_LEVEL
        value: INFO
      # Error tracking (OPTIONAL, and inert until you set it). Without a DSN the only record of a
      # production failure is Render's log stream: ephemeral, unsearchable at volume, no grouping and
      # no alerting. Worse, the background pool absorbs its exceptions by design (a failed analyst run
      # or scan job never surfaces to a user at all), so those failures have no signature anywhere
      # else. Paste a Sentry DSN here to turn it on; the SDK ships in the API dependencies, so no
      # build change is needed. Any Sentry-compatible ingest works, self-hosted included.
      # The boot log states which mode it is in ("Error tracking: on" / "OFF"). Never sent: request
      # bodies, and PII (send_default_pii stays off in app/core/observability.py). Performance
      # tracing is off unless SENTRY_TRACES_SAMPLE_RATE is set, so this cannot become a cost surprise.
      - key: SENTRY_DSN
        sync: false
      - key: OMI_DATABASE_URL
        fromDatabase:
          name: omisphere-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: '3.11.9'
      - key: OMI_MONTHLY_CREDIT_GRANT
        value: '20'
      # Clerk auth. The API verifies Clerk session JWTs (see app/core/clerk_auth.py).
      # The SECRET key is server-only and set in the Render dashboard, NEVER committed.
      # The publishable key is PUBLIC (it ships in the browser bundle by design) and is
      # used here only to derive the JWKS/issuer, so it's safe to commit as a value:
      # this guarantees the API can verify tokens even before the dashboard is filled in.
      #
      # THIS KEY AND THE WEB SERVICE'S NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY MUST NAME THE SAME
      # CLERK INSTANCE. The API derives its JWKS URL by base64-decoding this key, so if the
      # browser signs in against the production instance while the API still holds the
      # development one, every session JWT fails verification and the user is "signed in"
      # with no workspace. That outage is silent: verify_session_token just returns None.
      # This pair went out of step once already, when the dashboard was switched to the
      # pk_live key while these committed values still pinned pk_test, and a blueprint sync
      # would have re-pinned the dashboard back to test anyway. _validate_production_config
      # now refuses to boot a production deploy holding a pk_test key.
      #
      # Decodes to clerk.omisphere.online$, i.e. issuer https://clerk.omisphere.online,
      # which is the CNAME target Clerk asked for on the custom domain.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsub21pc3BoZXJlLm9ubGluZSQ
      # Signup trial: 1 credit, then they pay. Scans bill at ceil(accounts / 50)
      # credits (min 1, see compute_scan_credits), so one credit buys exactly one
      # scan of up to 50 accounts. That is deliberate: most new accounts arrive
      # from a shared report link, and one credit is enough to scan more of the
      # post they came from and see the product work, not enough to finish it.
      #
      # This is not the only free path, and the two are metered independently:
      # the pre-login front page gives every visitor 1 real scan of up to 25
      # accounts (DEMO_FREE_SCANS_PER_IP in app/routes/scan_async.py and
      # DEMO_MAX_COMMENTERS in app/routes/scan.py, both hardcoded and test-pinned,
      # NOT driven by this variable). That is "try it before signing up"; these 3
      # credits are "just signed up". Changing one never changes the other.
      #
      # Abuse guard: a signup from an IP that already claimed a trial gets 0
      # credits, on both the Clerk path (app/core/auth.py) and the legacy path
      # (app/routes/auth.py). Note the 5/hour/IP signup rate limit protects only
      # the legacy POST /v1/auth/signup route; Clerk signups do not pass through
      # it, so the per-IP trial suppression is the real guard there.
      #
      # Keep NEXT_PUBLIC_TRIAL_CREDITS (web service, below) equal to this value or
      # the displayed copy lies about what a new account gets.
      - key: OMI_FREE_TRIAL_CREDITS
        value: '1'
      - key: OMI_SUPER_ADMIN_EMAILS
        value: 'andrewexiga@gmail.com,landonnorris116@gmail.com,exigahayden1@gmail.com,couldbewiser@yahoo.com'
      - key: OMI_SCAN_MAX_COMMENTERS
        value: '150'
      # ===============================================================
      # Daily ceilings on PAID UPSTREAM API CALLS (twitterapi.io, YouTube)
      # ===============================================================
      # The compile step (/v1/scan/link/commenters) requires auth but charges NO
      # credits and calls the real X API, which bills per read. Credits cannot
      # guard it: there is nothing to spend. Its per-minute limiter bounds a
      # burst, is per instance, and resets on deploy; these are the ceilings that
      # survive a deploy, are correct across instances, and are recorded.
      #
      # Read today's spend against both at GET /v1/admin/usage (admin only).
      #
      # Per user per day. At ~$0.005 per X call, a 150-account investigation is
      # ~300 calls plus ~30 to compile. 1500 leaves room for several full
      # investigations back to back and caps a runaway at about $7.50 instead of
      # $216. Raise if real customers report hitting it; 0 disables.
      - key: OMI_UPSTREAM_DAILY_CALLS_PER_USER
        value: '1500'
      # Deployment-wide circuit breaker, NOT a business limit. When it trips it
      # refuses paying customers (with a 503 that says the fault is ours), so it
      # sits well above any plausible real day and exists only to stop a bug or
      # an attack emptying the API budget overnight. Raise it rather than
      # removing it. 0 disables.
      - key: OMI_UPSTREAM_DAILY_CALLS_GLOBAL
        value: '50000'
      - key: OMI_SCAN_MAX_HISTORY_PER_COMMENTER
        value: '50'
      - key: OMI_SCAN_CACHE_TTL_DAYS
        value: '7'
      # Manual-fill in dashboard
      - key: OMI_YOUTUBE_API_KEY
        sync: false
      # twitterapi.io key — required for Twitter/X scans (Twitter routes 503 without it).
      - key: OMI_TWITTER_API_KEY
        sync: false

      # ===============================================================
      # Stripe — webhook crediting + API backstop (see header comment)
      # ===============================================================
      # REQUIRED. Secret API key from Stripe Dashboard → Developers → API keys.
      # Must start with sk_test_ (test mode) or sk_live_ (live mode).
      # This is NOT the publishable key (pk_…). pk_ keys cannot create Checkout sessions.
      - key: OMI_STRIPE_SECRET_KEY
        sync: false
      # REQUIRED. Recurring monthly Price id (price_…) for $13.99/mo (or your amount).
      # Must be from the SAME mode as OMI_STRIPE_SECRET_KEY (test vs live).
      # Create: Product catalogue → Add product → recurring monthly → copy price id.
      - key: OMI_STRIPE_PRICE_ID
        sync: false
      # Checkout methods while Cards may still be pending approval. Default in code is link,card
      # (Link + Apple Pay via card wallets). Set to "link" only if card is fully blocked.
      - key: OMI_STRIPE_PAYMENT_METHOD_TYPES
        value: 'link,card'
      # REQUIRED. The WEB app URL customers land on after Stripe Checkout AND the origin every
      # shared report link is built from, no trailing slash. Set it to the CUSTOM DOMAIN
      # (https://omisphere.online), not the onrender.com host: this string is what gets pasted into
      # comment sections, so the onrender host makes every promoted link look like a staging URL.
      # If it points at the API host instead, paying customers get a 404 after checkout.
      - key: OMI_PUBLIC_BASE_URL
        sync: false
      # Display only — label next to Subscribe. The real charge is the Stripe Price.
      - key: OMI_SUBSCRIPTION_PRICE_DISPLAY
        value: '$13.99'
      # REQUIRED for instant crediting. The SIGNING SECRET (whsec_…) shown on the
      # endpoint's page in Stripe — not the API key, not the endpoint id. While
      # empty the webhook route is inert (acks with 200, credits nothing) and
      # billing still works via API reconciliation, just not instantly.
      - key: OMI_STRIPE_WEBHOOK_SECRET
        sync: false
      # OPTIONAL / UNUSED by current product. Hosted Checkout does not need Stripe.js.
      # Kept so a dashboard var named STRIPE_PUBLISHABLE_KEY is documented and harmless
      # if present; the API never reads it for Subscribe. Prefer deleting it unless you
      # plan a future client-side Stripe feature.
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      # ---------------------------------------------------------------
      # Omi Analyst — the reasoning layer. PRODUCTION DEFAULT: OpenRouter.
      # Interprets evidence the engine already produced; never touches
      # detection / scoring / OmiScore. If the ONE model inference cannot be
      # made (API key missing, provider error, or invalid output) the API
      # still works: the in-process deterministic Floor backs every
      # assessment (graceful fallback — never an error).
      #
      # Production path (OpenRouter): the comprehensive inference is routed
      # through the `omi-master-v1` OpenRouter preset, which carries the
      # compiled Master Analyst Protocol as its system prompt AND selects the
      # model (currently GPT-5 Mini). The repository is the source of truth
      # for the preset content; the preset is created once in the OpenRouter
      # dashboard. To go live, supply OPENROUTER_API_KEY (secret; set the
      # value in the dashboard, never committed). Then verify with
      # GET /v1/investigations/analyst/status -> active_provider: openrouter,
      # ready_for_live_model: true, blockers: [].
      # ---------------------------------------------------------------
      - key: OMI_ANALYST_ENABLED
        value: 'true'
      - key: OMI_ANALYST_PROVIDER
        value: 'openrouter'
      - key: OMI_OPENROUTER_PRESET
        value: 'omi-master-v1'
      # Secret — set the value in the Render dashboard, never in this file.
      - key: OPENROUTER_API_KEY
        sync: false
      # OMI_OPENROUTER_MODEL is intentionally UNSET: the omi-master-v1 preset
      # determines the model. Set it only to intentionally override the preset.
      #
      # The model we EXPECT the preset to serve. NOT sent on the wire (so a bad
      # value can never brick the AI path) — after each scan the code compares
      # it against the model OpenRouter reports serving and records
      # served_model_verified on the trace, so every investigation PROVES its
      # assessments + OMI scores came from GPT-5 Mini; a silent model swap is
      # logged loudly (analyst.verify SERVED-MODEL MISMATCH). Prefix-tolerant, so
      # a dated snapshot still verifies. Set to '' to disable the check.
      - key: OMI_OPENROUTER_EXPECTED_MODEL
        value: 'openai/gpt-5-mini'
      #
      # --- Cost guardrails (tune WITHOUT a code deploy) ---
      # Per-scan output-token ceiling — the single biggest lever on OpenRouter
      # spend. TEMPORARILY high (150000) to MEASURE real per-scan cost with no
      # truncation; lower it once cost data is in. It is a cap, not a
      # reservation — billing is on tokens actually generated.
      - key: OMI_ANALYST_COMPLETION_CEILING_TOKENS
        value: '150000'
      # GPT-5 reasoning effort (reasoning tokens bill as output). Unset lets the
      # preset decide; set minimal|low|medium|high to bound reasoning cost.
      # 'low' roughly halves reasoning spend vs 'high' for this task.
      - key: OMI_OPENROUTER_REASONING_EFFORT
        sync: false
      # One model generation timeout (background worker, not a user request). 500s lets a slow GPT-5
      # generation FINISH and be cached as a real result instead of being cut off and floored (the
      # "isn't ready yet" fallback, which also made re-opens re-run). The UI holds a loading screen and
      # polls for ~9 min. Still fails a genuinely stalled call, not a hang.
      - key: OMI_ANALYST_TIMEOUT_SECONDS
        value: '500'
      #
      # --- Legacy Hugging Face path (DEPRECATED — no longer the default) ---
      # Still supported as a fallback provider: to use it instead of
      # OpenRouter, set OMI_ANALYST_PROVIDER=huggingface and provide
      # OMI_ANALYST_ENDPOINT_URL + HF_TOKEN. These remain as unset
      # (sync:false) placeholders and have NO effect while the provider is
      # openrouter (the default above).
      - key: OMI_ANALYST_ENDPOINT_URL
        sync: false
      - key: OMI_ANALYST_HF_REVISION
        sync: false
      - key: HF_TOKEN
        sync: false
      # SMTP for watchlist alert email delivery (OPTIONAL — webhook delivery
      # works without these and the product stays functional). After setting
      # them, POST /v1/monitoring/test-alert from an admin account to verify.
      - key: OMI_SMTP_HOST
        sync: false
      - key: OMI_SMTP_PORT
        value: '587'
      - key: OMI_SMTP_USER
        sync: false
      - key: OMI_SMTP_PASSWORD
        sync: false
      - key: OMI_SMTP_FROM
        sync: false
      - key: OMI_SMTP_USE_TLS
        value: 'true'
      # Auto-generated by Render on first provision; stays stable across
      # deploys so issued session cookies aren't invalidated.
      - key: OMI_SESSION_SECRET
        generateValue: true

  # ---------------------------------------------------------------
  # Web — Next.js
  # ---------------------------------------------------------------
  - type: web
    name: omisphere-web
    runtime: node
    region: oregon
    plan: starter
    branch: main
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    # Without this Render cannot distinguish a wedged Next process from a healthy one, so it never
    # restarts it — a hung frontend stays hung. Shallow by design (app/healthz/route.ts): it must not
    # touch the API or database, or a downstream slowdown becomes a restart loop here.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '20.18.0'
      - key: OMI_API_ORIGIN
        fromService:
          name: omisphere-api
          type: web
          property: hostport
      # Display-only mirrors of the API's credit grants (inlined at build
      # time into marketing/UI copy). MUST match OMI_FREE_TRIAL_CREDITS and
      # OMI_MONTHLY_CREDIT_GRANT on omisphere-api, or the site lies.
      - key: NEXT_PUBLIC_TRIAL_CREDITS
        value: '1'
      - key: NEXT_PUBLIC_MONTHLY_CREDITS
        value: '20'
      # Pricing-page copy only. The real charge is the Stripe Price behind
      # OMI_STRIPE_PRICE_ID; this must match OMI_SUBSCRIPTION_PRICE_DISPLAY on the
      # API or the site advertises a number customers are not charged.
      - key: NEXT_PUBLIC_SUBSCRIPTION_PRICE
        value: '$13.99'
      # Same WEB public URL as on the API (no trailing slash), i.e. https://omisphere.online.
      # Used for absolute links, including the /r/<token> share URL the Share block copies, so a
      # stale value here is what makes promoted links point at the wrong host.
      - key: OMI_PUBLIC_BASE_URL
        sync: false
      # OPTIONAL — only if you later add Stripe.js / Elements. Hosted Checkout
      # does not need this today. Value is pk_test_… / pk_live_… (public).
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Clerk auth (frontend). The publishable key is PUBLIC (ships in the browser
      # bundle by design) and MUST exist at build time or the static prerender throws
      # "Missing publishableKey", so we commit it as a value here rather than leaving
      # it as a dashboard-only sync:false (which is empty during Render's build step).
      # The secret key is server-only and stays in the dashboard, NEVER committed.
      #
      # MUST be byte-identical to CLERK_PUBLISHABLE_KEY on the API service above. The two
      # sides name the Clerk instance independently and nothing at runtime reconciles them:
      # a mismatch signs the user in and then rejects every one of their API calls. See the
      # longer note on the API service.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsub21pc3BoZXJlLm9ubGluZSQ
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up

databases:
  # IMPORTANT: never run production on Render's `free` Postgres — free databases
  # are DELETED ~90 days after creation, which means total loss of the only
  # irreplaceable data we hold (investigations, fingerprints, watchlists,
  # ground-truth labels). Use a paid tier, which also includes automatic daily
  # backups. `basic-256mb` (~$6/mo) is the entry paid plan; bump to
  # `basic-1gb`/`basic-4gb` as data grows. Adjust the plan string to your account.
  - name: omisphere-postgres
    plan: basic-256mb
    region: oregon
    databaseName: omi
    user: omi
