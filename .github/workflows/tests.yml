name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on a branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev,youtube]
      - name: Run pytest
        run: pytest -q

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      # The web unit tests were not run by CI at all, so every guard in lib/*.test.ts was passing
      # or failing only on whichever machine last thought to run it. Several of them exist
      # specifically to catch drift between two declarations that nothing at runtime reconciles
      # (signal names, failure reasons, page metadata, the agent content set), which is exactly the
      # class of bug that survives review and only a test run catches.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          OMI_API_ORIGIN: http://127.0.0.1:8000
          OMI_PUBLIC_BASE_URL: http://localhost:3000
