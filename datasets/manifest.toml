# Tier-2C intake locations (see datasets/INTAKE.md). Governed as validation so
# committed Known-Good / Known-Mixed corpora are gated + adapter-matched on
# arrival (the labeled_tweets adapter collapses per-tweet files to accounts
# WITH text). Promote to train after the first calibration review.
[[dir]]
