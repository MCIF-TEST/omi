# OmiSphere — Dataset Governance Manifest
#
# Source of truth for which committed datasets may be ingested into training /
# evaluation, and why. The ingest pipeline (`app/ml/datasets/`) consults this.
#
#   status = "archive" | "quarantine"  ->  EXCLUDED from ingestion.
#   status = "train" | "validation" | "reference" | "heuristic"  ->  allowed
#     (operator-vouched: the quality gate runs but a failure is advisory).
#   Undeclared files  ->  governed by adapter detection + the quality gate only.
#
# Two rule kinds:
#   [[file]]  exact relative path (wins over dir rules; per-file overrides).
#   [[dir]]   path-prefix rule — governs a whole archive (e.g. an IO campaign
#             that ships as dozens of per-year files) with one entry.
#
# Layout note: the original corpus was relocated under `Datasets/` and large
# state-IO archives were added (some at the top level, some under `Datasets/`).
# This manifest reflects the CURRENT paths; the previous manifest was orphaned
# under `Datasets/manifest.toml` (wrong location + stale paths), which silently
# un-gated the poison sets — repaired here.

schema_version = 2

# ===========================================================================
# Directory rules — state-backed IO disclosure archives (coordination GROUND
# TRUTH). Every *_tweets_csv_hashed* file matches the io_disclosure adapter and
# is labeled political_coord/high. Validation-first (measure the engine against
# reality); promote to training after the first calibration is reviewed.
# ===========================================================================

