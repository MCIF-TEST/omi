# OmiSphere — Dataset Governance Manifest
#
# The source of truth for which committed datasets may be ingested into training,
# and why. The ingest pipeline (`app/ml/datasets/`) consults this file:
#
#   * status = "archive" | "quarantine"  ->  EXCLUDED from ingestion. Discovery
#     marks the file unsupported, so it can never reach the model by accident —
#     closing the "one rename away from poisoning training" hole.
#   * status = "train" | "validation" | "reference" | "heuristic"  ->  allowed.
#     These are operator-vouched: the runtime quality gate still runs and reports,
#     but for a vouched file a gate failure is advisory, not a hard block.
#   * Undeclared files  ->  governed by adapter detection + the quality gate only
#     (a new upload that looks like random-label noise or error-string poison is
#     blocked automatically). A missing manifest is a no-op: nothing is excluded.
#
# Status meanings:
#   train       usable as training data
#   validation  hold-out / benchmark only — never train on it
#   reference   keep for feature distributions / calibration; not for training
#   heuristic   threshold-tuning reference only
#   archive     kept for provenance; NOT ingested (low value / wrong domain)
#   quarantine  kept for provenance; NOT ingested (actively harmful / poison)
#
# Verdicts below are from docs/omisphere-tier2-audit.md +
# docs/omisphere-strategic-assessment.md (2026-06-02).

schema_version = 1

# ---------------------------------------------------------------------------
# Quarantine — active poison. Must never train.
# ---------------------------------------------------------------------------

[[file]]
path = "Fake Social Media Account Detection Dataset/bot_detection_data.csv"
status = "quarantine"
kind = "accounts"
provenance = "uploaded"
reason = "50k rows; the label has ~zero correlation with any feature (random-label noise). 50% of the committed corpus. Would degrade any model trained on it."

[[file]]
path = "ai vs human text/ai_human_detection_v1.csv"
status = "quarantine"
kind = "text"
provenance = "uploaded"
reason = "AI class is contaminated with literal API error strings ('Error: 400 Client Error: ... api.groq.com'). Teaches 'contains an error' = AI."

# ---------------------------------------------------------------------------
# Archive — low value / wrong domain / untrainable. Kept for provenance only.
# ---------------------------------------------------------------------------

[[file]]
path = "Fake Social Media Account Detection Dataset/fake_social_media.csv"
status = "archive"
kind = "accounts"
provenance = "uploaded"
reason = "99.8% single class (2993 fake / 7 real) — untrainable; would bias the model toward 'fake'. Useful only for feature distributions, read manually."

[[file]]
path = "ai vs human text/ai_vs_human_text.csv"
status = "archive"
kind = "text"
provenance = "uploaded"
reason = "100% templated stub text ('This is an example of text generated by ChatGPT...'). Synthetic-template poison."

# ---------------------------------------------------------------------------
# Train — usable training data.
# ---------------------------------------------------------------------------

[[file]]
path = "Fake Social Media Account Detection Dataset/real_users.csv"
status = "train"
kind = "accounts"
provenance = "uploaded"
reason = "Labeled real Twitter profiles (filename-labeled). Combined with fake_users.csv. ~35% nulls; legacy MIB-style dump but the strongest real account source committed."

[[file]]
path = "Fake Social Media Account Detection Dataset/fake_users.csv"
status = "train"
kind = "accounts"
provenance = "uploaded"
reason = "Labeled fake Twitter profiles (filename-labeled). Pairs with real_users.csv."

[[file]]
path = "Fake Social Media Account Detection Dataset/fake_social_media_global_2.0_with_missing.xlsx"
status = "train"
kind = "accounts"
provenance = "uploaded"
reason = "Best behavioral account set (1941/1059, 24 cols). Currently UNREADABLE — .xlsx is rejected by discovery; export to CSV to unlock. Tracked here so the intent is recorded."

# ---------------------------------------------------------------------------
# Validation — hold-out / benchmark only. Never train on these.
# ---------------------------------------------------------------------------

[[file]]
path = "ai vs human text/ai_vs_human_text_2026.csv"
status = "validation"
kind = "text"
provenance = "uploaded"
reason = "AI-writing validation benchmark (already wired in ai_writing_benchmark.py). Dedupe first (~51% duplicate texts); 'generation_method' metadata leaks the label if it ever reaches features."

[[file]]
path = "Fake Social Media Account Detection Dataset/reddit_dead_internet_analysis_2026.csv"
status = "validation"
kind = "accounts"
provenance = "uploaded"
reason = "Small (500 rows) but has a bot-type taxonomy and a real bot/human reply-delay gap (6s vs 1756s). Validation/reference; the current adapter is lossy (drops reply_delay/karma)."

# ---------------------------------------------------------------------------
# Reference — keep for distributions / calibration; not training.
# ---------------------------------------------------------------------------

[[file]]
path = "activity_botscore.csv"
status = "reference"
kind = "accounts"
provenance = "uploaded"
reason = "11k rows, continuous bot_score (no class label) — no adapter matches, so it is ignored by ingestion today. Keep for calibrating a bot-score->tier mapping."

[[file]]
path = "article_discusses_claim"
status = "archive"
kind = "text"
provenance = "uploaded"
reason = "XZ-pickled DataFrame, no extension, wrong domain (fact-check). Unreadable by current pandas and ignored by discovery. Dead weight."
