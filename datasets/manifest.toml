status = "validation"
kind = "accounts"
provenance = "curated_known_good"
reason = "Tier-2C Known Good: active humans WITH tweet text (e.g. Cresci-2017 genuine_accounts + tweets). Label from filename (genuine/human vs bot/spam)."

[[dir]]
path = "known-mixed"
status = "validation"
kind = "accounts"
provenance = "curated_known_mixed"
reason = "Tier-2C Known Mixed: legitimate-but-coordination-shaped accounts (journalists/news orgs/influencers/brands/politicians/activists) WITH timelines. Labeled human; category tracked via campaign_id."

